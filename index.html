<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Gallery</title>
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Gallery">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css">
<style>
:root {
  --bg: #f4f2ee; --surface: #ffffff; --ink: #1b1a17; --muted: #6e6a62; --line: #e3dfd7;
  --accent: #8a5a2b; --accent-ink: #ffffff; --stage: #e8e5df; --danger: #a33a2a;
  --bar: rgba(244,242,238,.86);
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --r: 12px;
  --st: env(safe-area-inset-top); --sb: env(safe-area-inset-bottom);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --surface: #1c1b19; --ink: #ece8e1; --muted: #9a958c; --line: #2d2b28;
    --accent: #c99a5b; --accent-ink: #1b1a17; --stage: #0a0a09; --danger: #e0705e;
    --bar: rgba(18,18,17,.86);
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1c1b19; --ink: #ece8e1; --muted: #9a958c; --line: #2d2b28;
  --accent: #c99a5b; --accent-ink: #1b1a17; --stage: #0a0a09; --danger: #e0705e;
  --bar: rgba(18,18,17,.86);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
body { min-height: 100svh; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
img { display: block; max-width: 100%; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: var(--bar); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line); padding: calc(var(--st) + 6px) 8px 6px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 52px; }
.bar-l, .bar-r { display: flex; align-items: center; gap: 2px; }
.bar-r { justify-content: flex-end; }
.bar-t { margin: 0; font: 600 17px/1.2 var(--sans); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56vw; }
.ibtn { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; min-width: 40px; padding: 0 8px; border-radius: 10px; color: var(--accent); font-weight: 500; font-size: 16px; }
.ibtn:active { background: var(--line); }
.ibtn svg { width: 22px; height: 22px; }
.ibtn.back { padding-left: 2px; max-width: 46vw; }
.ibtn.back span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ibtn.strong { font-weight: 600; }

/* ---------- tabs ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 8px; background: var(--bar);
  backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-top: 1px solid var(--line); padding: 6px 12px calc(var(--sb) + 6px); }
.tabs a { flex: 0 1 160px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 11px; font-weight: 500; color: var(--muted); border-radius: 10px; }
.tabs a svg { width: 24px; height: 24px; }
.tabs a.on { color: var(--accent); }
body.has-tabs main { padding-bottom: calc(var(--sb) + 84px); }

main { max-width: 860px; margin: 0 auto; padding: 0 16px 40px; }
main.wide { max-width: 1240px; }
main.flush { padding-left: 0; padding-right: 0; }

/* ---------- typography ---------- */
.display { font-family: var(--serif); font-weight: 600; letter-spacing: -.01em; line-height: 1.05; margin: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.page-title { font-size: 40px; margin: 22px 0 4px; }

/* ---------- artists list ---------- */
.search { position: relative; margin: 12px 0 8px; }
.search input { width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 12px 0 36px; font: inherit; font-size: 16px; }
.search svg { position: absolute; left: 10px; top: 10px; width: 20px; height: 20px; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 14px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.row:active { background: var(--line); }
.thumb { flex: none; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; background: var(--stage); display: grid; place-items: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.initials { font-family: var(--serif); font-size: 24px; font-weight: 600; color: var(--muted); }
.row-main { flex: 1; min-width: 0; }
.row-name { font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.15; }
.row-meta { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 2px; }
.count svg { width: 16px; height: 16px; opacity: .6; }

/* ---------- empty / loading ---------- */
.empty { text-align: center; padding: 64px 24px; }
.empty .display { font-size: 32px; margin-bottom: 8px; }
.empty p { color: var(--muted); margin: 0 auto 24px; max-width: 32ch; }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: sp 0.8s linear infinite; margin: 80px auto; }
@keyframes sp { to { transform: rotate(360deg); } }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 20px; border-radius: 22px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px; }
.btn:active { opacity: .85; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.small { height: 34px; padding: 0 14px; font-size: 14px; border-radius: 17px; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 18px; height: 18px; }

/* ---------- artist page ---------- */
.artist-head { padding: 26px 0 8px; }
.artist-head .display { font-size: 44px; }
.artist-head .meta { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.bio { margin: 14px 0 0; white-space: pre-line; font-size: 16px; }
.section-h { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.tile-img { aspect-ratio: 1; background: var(--stage); border-radius: 8px; overflow: hidden; display: grid; place-items: center; }
.tile-img img { width: 100%; height: 100%; object-fit: cover; }
.tile-img .noimg { color: var(--muted); font-size: 13px; }
.tile-cap { padding: 6px 2px 0; font-size: 14px; line-height: 1.3; }
.tile-cap b { display: block; font-weight: 500; }
.tile-cap span { color: var(--muted); font-size: 13px; }
.tile:active .tile-img { opacity: .8; }

/* ---------- artwork page ---------- */
.stage-wrap { container-type: inline-size; background: var(--stage); position: relative; }
.slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.slides::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: center; display: grid; place-items: center; margin: 0; padding: 14px; cursor: zoom-in; }
.slide img { width: 100%; height: 100%; object-fit: contain; }
.stage-empty { padding: 60px 20px; text-align: center; color: var(--muted); }
.stage-ui { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 0 12px; background: var(--stage); }
.dots { display: flex; gap: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: .35; transition: opacity .2s, transform .2s; }
.dots i.on { opacity: 1; transform: scale(1.2); }
.zoom-hint { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.zoom-hint svg { width: 14px; height: 14px; }
.aw-info { padding: 22px 16px 0; max-width: 860px; margin: 0 auto; }
.aw-info .display { font-size: 38px; }
.aw-artist { margin: 6px 0 0; font-size: 17px; }
.aw-artist a { color: var(--accent); font-weight: 500; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 18px 0 0; font-size: 15px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.notes { white-space: pre-line; margin: 16px 0 0; }
.more { padding: 26px 16px 0; max-width: 860px; margin: 0 auto; }
.more-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity; padding: 2px 2px 8px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip a { flex: 0 0 76px; scroll-snap-align: start; }
.strip .s-img { width: 76px; height: 76px; border-radius: 8px; overflow: hidden; background: var(--stage); border: 2px solid transparent; }
.strip .s-img img { width: 100%; height: 100%; object-fit: cover; }
.strip a.on .s-img { border-color: var(--accent); }
.strip .s-cap { font-size: 11px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip a.on .s-cap { color: var(--ink); font-weight: 500; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.pn a { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; background: var(--surface); }
.pn a.next { text-align: right; }
.pn a span { display: block; font-size: 12px; color: var(--muted); }
.pn a b { display: block; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pn .none { visibility: hidden; }
.about { max-width: 860px; margin: 22px auto 0; padding: 0 16px; }
.about details { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 0; }
.about summary { cursor: pointer; font-weight: 500; list-style: none; display: flex; justify-content: space-between; }
.about summary::-webkit-details-marker { display: none; }
.about summary::after { content: "+"; color: var(--muted); font-size: 20px; line-height: 1; }
.about details[open] summary::after { content: "–"; }

/* ---------- gallery ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 10px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.masonry { columns: 2; column-gap: 12px; }
@media (min-width: 700px) { .masonry { columns: 3; column-gap: 16px; } }
@media (min-width: 1050px) { .masonry { columns: 4; } }
.m-item { display: block; break-inside: avoid; margin-bottom: 16px; }
.m-item img { width: 100%; height: auto; border-radius: 6px; background: var(--stage); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 18px rgba(0,0,0,.08); }
.m-item .noimg { aspect-ratio: 4/3; border-radius: 6px; background: var(--stage); display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.m-cap { padding: 6px 2px 0; font-size: 13px; line-height: 1.3; }
.m-cap b { display: block; font-weight: 500; }
.m-cap span { color: var(--muted); }

/* ---------- forms ---------- */
.form { padding: 18px 0 0; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; padding: 10px 12px; }
.field textarea { min-height: 96px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 18px; }
.group h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (min-width: 640px) { .imgs { grid-template-columns: repeat(4, 1fr); } }
.img-item { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--stage); }
.img-item img { width: 100%; height: 100%; object-fit: cover; }
.img-item .x, .img-item .star { position: absolute; top: 4px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center; }
.img-item .x { right: 4px; }
.img-item .star { left: 4px; }
.img-item .x svg, .img-item .star svg { width: 16px; height: 16px; }
.img-item .main-badge { position: absolute; left: 4px; bottom: 4px; font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 2px 6px; border-radius: 4px; }
.img-item .prog { position: absolute; inset: auto 0 0 0; height: 4px; background: rgba(0,0,0,.3); }
.img-item .prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.img-item.busy img { opacity: .5; }
.add-img { aspect-ratio: 1; border: 1.5px dashed var(--line); border-radius: 8px; display: grid; place-items: center; text-align: center; color: var(--accent); font-size: 13px; font-weight: 500; cursor: pointer; padding: 6px; }
.add-img svg { width: 26px; height: 26px; margin: 0 auto 2px; display: block; }
.danger-zone { margin: 26px 0 0; text-align: center; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.field .seg label { margin: 0; font-size: inherit; color: inherit; position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; text-align: center; padding: 11px 6px; font-size: 15px; font-weight: 500; color: var(--muted); cursor: pointer; }
.seg label + label span { border-left: 1px solid var(--line); }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.seg.need { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }

/* ---------- ownership ---------- */
.own-tag { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.own-tag.seen { color: var(--muted); }
.own-ask { margin: 18px 0 0; padding: 14px; border: 1px dashed var(--accent); border-radius: var(--r); background: var(--surface); }
.own-ask p { margin: 0 0 10px; font-weight: 500; }
.own-ask .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.own-ask .left { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.next-sort { display: inline-flex; margin-top: 14px; font-weight: 500; color: var(--accent); }
.pill { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; border: 1px solid var(--line); color: var(--muted); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
.chips + .chips { padding-top: 0; }
.chip .n { color: var(--muted); margin-left: 4px; }
.chip.on .n { color: inherit; opacity: .7; }

/* ---------- auth ---------- */
.auth { max-width: 380px; margin: 0 auto; padding: calc(var(--st) + 10vh) 24px 40px; }
.auth .display { font-size: 52px; text-align: center; }
.auth .tag { text-align: center; color: var(--muted); margin: 6px 0 32px; }
.auth .switch { text-align: center; margin-top: 18px; font-size: 15px; }
.auth .switch button { color: var(--accent); font-weight: 500; }
.err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 4px 0 10px; }

/* ---------- account ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 22px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; text-align: center; }
.stat b { display: block; font-family: var(--serif); font-size: 30px; font-weight: 600; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }
.tip { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; font-size: 14px; margin-bottom: 22px; }
.tip b { display: block; margin-bottom: 4px; }

/* ---------- misc ---------- */
.demo-banner { background: var(--accent); color: var(--accent-ink); font-size: 12px; text-align: center; padding: 6px 12px; font-weight: 500; }
.toast { position: fixed; left: 50%; bottom: calc(var(--sb) + 90px); transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 100; transition: .25s; pointer-events: none; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.pswp { --pswp-bg: #0b0b0a; }

/* ---------- sharing ---------- */
.ctx-banner { background: var(--ink); color: var(--bg); font-size: 13px; padding: 7px 16px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.ctx-banner b { font-weight: 600; }
.ctx-banner a { color: var(--bg); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
.choices { display: grid; gap: 8px; }
.choice { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; background: var(--bg); }
.choice input { margin: 3px 0 0; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.choice b { display: block; font-weight: 600; }
.choice span { font-size: 13px; color: var(--muted); }
.choice:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.explain { font-size: 14px; color: var(--muted); margin: 0 0 18px; }
.center { text-align: center; }
.qr { width: min(72vw, 280px); margin: 8px auto 6px; background: #fff; padding: 12px; border-radius: 14px; box-shadow: 0 2px 14px rgba(0,0,0,.12); aspect-ratio: 1; }
.qr svg { width: 100%; height: 100%; display: block; }
.btn-row { display: flex; flex-direction: column; gap: 10px; max-width: 340px; margin: 18px auto 0; }
.done-mark { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin: 40px auto 14px; }
.done-mark svg { width: 34px; height: 34px; }
.plist { list-style: none; margin: 0 0 22px; padding: 0; }
.plist li { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.plist .who { flex: 1; min-width: 0; }
.plist .who b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist .who span { font-size: 13px; color: var(--muted); }
.plist select { font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); padding: 6px 8px; }
.linkbtn { color: var(--accent); font-weight: 500; font-size: 14px; padding: 6px 4px; }
.linkbtn.danger { color: var(--danger); }
.h3 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 24px 0 4px; }
.invite-card { max-width: 420px; margin: 0 auto; text-align: center; padding: 36px 8px 0; }
.invite-card .display { font-size: 40px; margin: 8px 0 6px; }
.invite-card p { margin: 0 0 10px; }
.menu a { display: flex; justify-content: space-between; align-items: center; padding: 11px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
.menu a:last-child { border-bottom: 0; }
.menu a svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; font-size: 14px; margin: 0 0 18px; }

/* ---------- small helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const firstName = n => (n || "").trim().split(/\s+/)[0] || "";
const possessive = n => n ? (n.endsWith("s") ? n + "’" : n + "’s") : "their";

/* ---------- sorting & lookups ---------- */
function sortKey(a) {
  const n = (a.sortName || "").trim() || (a.name || "").trim().split(/\s+/).pop() || "";
  return (n + " " + (a.name || "")).toLowerCase();
}
const artistsSorted = () => [...G.artists.values()].sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
const yearNum = y => { const m = String(y || "").match(/\d{3,4}/); return m ? +m[0] : 99999; };
function worksOf(artistId) {
  return [...G.artworks.values()].filter(w => w.artistId === artistId)
    .sort((a, b) => yearNum(a.year) - yearNum(b.year) || (a.title || "").localeCompare(b.title || ""));
}
function allWorksSorted() {
  const order = new Map(artistsSorted().map((a, i) => [a.id, i]));
  return [...G.artworks.values()].sort((a, b) =>
    (order.get(a.artistId) ?? 1e9) - (order.get(b.artistId) ?? 1e9) ||
    yearNum(a.year) - yearNum(b.year) || (a.title || "").localeCompare(b.title || ""));
}
const cover = w => (w && w.images && w.images[0]) || null;
function artistCover(artistId) { for (const w of worksOf(artistId)) if (cover(w)) return cover(w); return null; }
function lifeDates(a) {
  if (a.born && a.died) return `${a.born}–${a.died}`;
  if (a.born) return `b. ${a.born}`;
  if (a.died) return `d. ${a.died}`;
  return "";
}
const ownLabel = o => o === "mine" ? (G.ro ? `In ${possessive(firstName(G.ownerName))} collection` : "In my collection") : "Seen elsewhere";
const ownOf = w => (w.ownership === "mine" || w.ownership === "seen") ? w.ownership : "unset";
const whereLabel = o => o === "mine" ? "Location" : o === "seen" ? "Seen at" : "Where";
const unsorted = () => allWorksSorted().filter(w => ownOf(w) === "unset");
const seenPill = w => ownOf(w) === "seen" ? '<span class="pill">Seen</span>' : "";
const artistMeta = a => [lifeDates(a), a.nationality].filter(Boolean).join(" · ");
const initials = name => (name || "?").split(/\s+/).filter(Boolean).map(s => s[0]).slice(0, 2).join("").toUpperCase();

/* =====================================================================
   2. DATA STORES  (Firebase for real use, in-memory for demo mode)
   Firestore layout (ready for sharing later):
     users/{uid}/artists/{artistId}
     users/{uid}/artworks/{artworkId}   (artistId, title, …, images[])
   Storage layout:
     users/{uid}/artworks/{artworkId}/{imageId}.jpg  and  {imageId}_t.jpg
   ===================================================================== */
async function firebaseStore() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [{ initializeApp }, A, F, ST] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"),
    import(base + "firebase-firestore.js"), import(base + "firebase-storage.js"),
  ]);
  const fb = initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(fb);
  let db;
  try { db = F.initializeFirestore(fb, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch { db = F.getFirestore(fb); }
  const storage = ST.getStorage(fb);
  let unsubs = [];
  const me = () => S.user.uid;
  const toMap = snap => new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }]));
  const col = name => F.collection(db, "users", S.user.uid, name);
  const docRef = (name, id) => F.doc(db, "users", S.user.uid, name, id);
  return {
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email } : null)),
    signIn: (e, p) => A.signInWithEmailAndPassword(auth, e, p),
    signUp: (e, p) => A.createUserWithEmailAndPassword(auth, e, p),
    reset: e => A.sendPasswordResetEmail(auth, e),
    signOut: () => A.signOut(auth),
    subscribe(onData, onError) {
      this.unsubscribe();
      let got = { a: false, w: false };
      const done = () => got.a && got.w && onData();
      const quiet = e => console.warn(e);
      unsubs = [
        F.onSnapshot(col("artists"), snap => { S.artists = toMap(snap); got.a = true; done(); }, onError),
        F.onSnapshot(col("artworks"), snap => { S.artworks = toMap(snap); got.w = true; done(); }, onError),
        F.onSnapshot(F.doc(db, "users", me()), snap => { S.profile = snap.exists() ? snap.data() : {}; done(); }, quiet),
        F.onSnapshot(col("shares"), snap => { S.shares = toMap(snap); done(); }, quiet),
        F.onSnapshot(col("sharedWithMe"), snap => { S.sharedWithMe = toMap(snap); done(); }, quiet),
        F.onSnapshot(F.query(F.collection(db, "invites"), F.where("owner", "==", me())), snap => { S.invites = toMap(snap); done(); }, quiet),
      ];
    },
    /* ----- sharing ----- */
    saveProfile: data => F.setDoc(F.doc(db, "users", me()), data, { merge: true }),
    async createInvite(scope) {
      const code = newCode();
      await F.setDoc(F.doc(db, "invites", code), {
        owner: me(), ownerName: myName(), ownerEmail: S.user.email || "", scope, claimedBy: null,
        createdAt: F.serverTimestamp(), expiresAt: F.Timestamp.fromMillis(Date.now() + INVITE_HOURS * 3600e3),
      });
      return code;
    },
    cancelInvite: code => F.deleteDoc(F.doc(db, "invites", code)),
    setShareScope: (viewer, scope) => F.updateDoc(F.doc(db, "users", me(), "shares", viewer), { scope }),
    removeShare: viewer => F.deleteDoc(F.doc(db, "users", me(), "shares", viewer)),
    async getInvite(code) {
      const snap = await F.getDoc(F.doc(db, "invites", code));
      return snap.exists() ? { code, ...snap.data() } : null;
    },
    async acceptInvite(inv) {
      const b = F.writeBatch(db);
      b.update(F.doc(db, "invites", inv.code), { claimedBy: me(), claimedAt: F.serverTimestamp() });
      b.set(F.doc(db, "users", inv.owner, "shares", me()), { viewerUid: me(), viewerEmail: S.user.email || "", scope: inv.scope, invite: inv.code, createdAt: F.serverTimestamp() });
      b.set(F.doc(db, "users", me(), "sharedWithMe", inv.owner), { ownerUid: inv.owner, ownerName: inv.ownerName || "", ownerEmail: inv.ownerEmail || "", createdAt: F.serverTimestamp() });
      await b.commit();
    },
    async leaveShared(owner) {
      await F.deleteDoc(F.doc(db, "users", owner, "shares", me())).catch(() => {});
      await F.deleteDoc(F.doc(db, "users", me(), "sharedWithMe", owner));
    },
    removePointer: owner => F.deleteDoc(F.doc(db, "users", me(), "sharedWithMe", owner)),
    // watch a gallery shared with me; follows changes to what I'm allowed to see
    openShared(owner, cb) {
      let unsA = null, unsW = null, scope = null;
      const stop = () => { unsA && unsA(); unsW && unsW(); unsA = unsW = null; };
      const unsS = F.onSnapshot(F.doc(db, "users", owner, "shares", me()), snap => {
        if (!snap.exists()) { stop(); cb.gone(); return; }
        const sc = snap.data().scope;
        if (sc === scope) return;
        scope = sc; cb.scope(sc);
        unsW && unsW();
        const works = F.collection(db, "users", owner, "artworks");
        unsW = F.onSnapshot(sc === "both" ? works : F.query(works, F.where("ownership", "==", sc)), s => cb.works(toMap(s)), e => console.warn(e));
        unsA ||= F.onSnapshot(F.collection(db, "users", owner, "artists"), s => cb.artists(toMap(s)), e => console.warn(e));
      }, e => { console.warn(e); stop(); cb.gone(); });
      return () => { unsS(); stop(); };
    },
    unsubscribe() { unsubs.forEach(u => u()); unsubs = []; },
    save(kind, obj, isNew) {
      const { id, ...data } = obj;
      const extra = { updatedAt: F.serverTimestamp() };
      if (isNew) extra.createdAt = F.serverTimestamp();
      return F.setDoc(docRef(kind, id), { ...data, ...extra }, { merge: true });
    },
    remove: (kind, id) => F.deleteDoc(docRef(kind, id)),
    upload(path, blob, onProgress) {
      const r = ST.ref(storage, `users/${S.user.uid}/${path}`);
      return new Promise((resolve, reject) => {
        const task = ST.uploadBytesResumable(r, blob, { contentType: "image/jpeg", cacheControl: "public,max-age=31536000" });
        task.on("state_changed", s => onProgress && onProgress(s.bytesTransferred / (s.totalBytes || 1)), reject,
          async () => resolve({ path: r.fullPath, url: await ST.getDownloadURL(r) }));
      });
    },
    deleteFile: path => path ? ST.deleteObject(ST.ref(storage, path)).catch(() => {}) : Promise.resolve(),
  };
}

/* Demo mode: an in-memory stand-in for Firebase that pretends to have
   several users, so sharing can be tried out. Nothing is saved. */
function demoStore() {
  const DB = { users: {}, invites: {} };
  const U = uid => DB.users[uid] ||= { artists: new Map(), artworks: new Map(), shares: new Map(), sharedWithMe: new Map(), profile: {} };
  let who = { uid: "demo", email: "you@example.com" }, authCb = () => {}, own = null;
  const watchers = new Set();
  const me = () => who.uid;
  const bump = () => {
    if (own) { S.invites = new Map(Object.entries(DB.invites).filter(([, v]) => v.owner === me()).map(([k, v]) => [k, { id: k, ...v }])); own(); }
    watchers.forEach(w => w());
  };
  let seeded = null;
  const seed = () => seeded ||= (async () => {
    U("demo").profile = { name: "You" };
    await seedDemo(U("demo"), "demo");
    await seedDemo(U("sam"), "sam");
    U("sam").profile = { name: "Sam Carter" };
    U("sam").shares.set("demo", { id: "demo", viewerUid: "demo", viewerEmail: "you@example.com", scope: "mine" });
    U("demo").sharedWithMe.set("sam", { id: "sam", ownerUid: "sam", ownerName: "Sam Carter", ownerEmail: "sam@example.com" });
  })();
  // for trying things out: __demo.as("friend") pretends to sign in as someone else
  window.__demo = { as(uid, email) { who = { uid, email: email || uid + "@example.com" }; authCb(who); }, DB };
  return {
    onAuth: cb => { authCb = cb; cb(who); },
    signIn: async () => {}, signUp: async () => {}, reset: async () => {},
    signOut: async () => toast("Demo mode — there is no account to sign out of"),
    async subscribe(onData) {
      await seed();
      const u = U(me());
      S.artists = u.artists; S.artworks = u.artworks; S.shares = u.shares; S.sharedWithMe = u.sharedWithMe; S.profile = u.profile;
      own = onData; bump();
    },
    unsubscribe() { own = null; },
    async save(kind, obj) {
      const map = kind === "artists" ? S.artists : S.artworks;
      map.set(obj.id, { ...(map.get(obj.id) || {}), ...obj }); bump();
    },
    async remove(kind, id) { (kind === "artists" ? S.artists : S.artworks).delete(id); bump(); },
    async upload(path, blob, onProgress) {
      for (let p = 0; p <= 1; p += 0.25) { onProgress && onProgress(p); await new Promise(r => setTimeout(r, 60)); }
      return { path, url: URL.createObjectURL(blob) };
    },
    deleteFile: async () => {},
    async saveProfile(data) { Object.assign(U(me()).profile, data); bump(); },
    async createInvite(scope) {
      const code = newCode();
      DB.invites[code] = { owner: me(), ownerName: myName(), ownerEmail: who.email, scope, claimedBy: null, createdAt: Date.now(), expiresAt: Date.now() + INVITE_HOURS * 3600e3 };
      bump(); return code;
    },
    async cancelInvite(code) { delete DB.invites[code]; bump(); },
    async setShareScope(viewer, scope) { const sh = U(me()).shares.get(viewer); sh && (sh.scope = scope); bump(); },
    async removeShare(viewer) { U(me()).shares.delete(viewer); bump(); },
    async getInvite(code) { const v = DB.invites[code]; return v ? { code, ...v } : null; },
    async acceptInvite(inv) {
      const v = DB.invites[inv.code];   // same checks as the security rules
      if (!v || v.claimedBy || v.expiresAt < Date.now() || v.owner === me()) throw Object.assign(new Error("Invitation not valid"), { code: "permission-denied" });
      v.claimedBy = me(); v.claimedAt = Date.now();
      U(v.owner).shares.set(me(), { id: me(), viewerUid: me(), viewerEmail: who.email, scope: v.scope, invite: inv.code });
      U(me()).sharedWithMe.set(v.owner, { id: v.owner, ownerUid: v.owner, ownerName: v.ownerName, ownerEmail: v.ownerEmail });
      bump();
    },
    async leaveShared(owner) { U(owner).shares.delete(me()); U(me()).sharedWithMe.delete(owner); bump(); },
    async removePointer(owner) { U(me()).sharedWithMe.delete(owner); bump(); },
    openShared(owner, cb) {
      let scope = null, gone = false;
      const check = () => {
        if (gone) return;
        const sh = U(owner).shares.get(me());
        if (!sh) { gone = true; watchers.delete(check); cb.gone(); return; }
        if (sh.scope !== scope) { scope = sh.scope; cb.scope(scope); }
        cb.artists(new Map(U(owner).artists));
        cb.works(new Map([...U(owner).artworks].filter(([, w]) => scope === "both" || w.ownership === scope)));
      };
      watchers.add(check); setTimeout(check, 0);
      return () => watchers.delete(check);
    },
  };
}

/* Demo data: invented artists with generated "paintings" */
async function seedDemo(target, who) {
  const paint = (w, h, seed) => new Promise(res => {
    const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d");
    let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const hue = Math.floor(rnd() * 360);
    const grd = g.createLinearGradient(0, 0, w, h);
    grd.addColorStop(0, `hsl(${hue},45%,${30 + rnd() * 30}%)`); grd.addColorStop(1, `hsl(${(hue + 60) % 360},40%,${20 + rnd() * 40}%)`);
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 18; i++) {
      g.fillStyle = `hsla(${(hue + rnd() * 120) % 360},${40 + rnd() * 40}%,${30 + rnd() * 50}%,${0.25 + rnd() * 0.5})`;
      g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 20 + rnd() * w / 3, 20 + rnd() * h / 4, rnd() * 3, 0, 7); g.fill();
    }
    g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = Math.max(w, h) / 200;
    for (let i = 0; i < 6; i++) { g.beginPath(); g.moveTo(rnd() * w, rnd() * h); g.bezierCurveTo(rnd() * w, rnd() * h, rnd() * w, rnd() * h, rnd() * w, rnd() * h); g.stroke(); }
    c.toBlob(b => res({ url: URL.createObjectURL(b), w, h }), "image/jpeg", 0.85);
  });
  const img = async (w, h, seed) => { const p = await paint(w, h, seed); return { id: newId(), url: p.url, thumbUrl: p.url, w, h, path: "", thumbPath: "" }; };
  const sets = { demo: { artists: [
    { id: "a1", name: "Eleanor Vance", born: "1952", nationality: "British", bio: "Sample artist for demo mode. Landscapes of the Peak District in oil, built up in heavy layers.\n\nEdit or delete me — nothing in demo mode is saved." },

    { id: "a3", name: "Mei Okafor", born: "1987", nationality: "Nigerian-British", bio: "Sample artist. Large-scale works on paper." },
  ], works: [
    { artistId: "a1", title: "Stanage Edge, Evening", year: "1998", medium: "Oil on canvas", dimensions: "90 × 120 cm", ownership: "mine", location: "Living room", images: [[1600, 1200, 3], [1200, 1500, 7]] },
    { artistId: "a1", title: "Winter Light, Hathersage", year: "2004", medium: "Oil on board", dimensions: "40 × 50 cm", images: [[1500, 1200, 11]] },
    { artistId: "a1", title: "Ladybower Study", year: "2012", medium: "Watercolour", images: [[1200, 1700, 19], [1700, 1200, 23], [1400, 1400, 29]] },
    { artistId: "a2", title: "Composition in Ochre", year: "1974", medium: "Acrylic on canvas", dimensions: "150 × 150 cm", ownership: "seen", location: "Museu de Arte, Lisbon", images: [[1400, 1400, 31]] },
    { artistId: "a2", title: "Tide", year: "1989", medium: "Oil on linen", ownership: "mine", images: [[2000, 1000, 37]] },
    { artistId: "a3", title: "Harmattan I", year: "2019", medium: "Ink and gouache on paper", dimensions: "200 × 140 cm", ownership: "seen", location: "Millennium Gallery, Sheffield", images: [[1100, 1600, 41], [1600, 1100, 43]] },
  ] }, sam: { artists: [
    { id: "b1", name: "Ruth Ainsworth", born: "1961", nationality: "British", bio: "Sample artist in Sam’s demo gallery. Seascapes and harbours." },
    { id: "b2", name: "Jonas Lind", born: "1975", nationality: "Swedish", bio: "Sample artist. Prints and etchings." },
  ], works: [
    { artistId: "b1", title: "Whitby Harbour", year: "2008", medium: "Oil on canvas", ownership: "mine", location: "Hallway", images: [[1600, 1100, 51]] },
    { artistId: "b1", title: "North Sea, Grey Day", year: "2015", medium: "Oil on board", ownership: "mine", images: [[1300, 1300, 53], [1300, 1600, 57]] },
    { artistId: "b2", title: "Pines III", year: "2020", medium: "Etching", ownership: "seen", location: "Moderna Museet", images: [[1100, 1500, 59]] },
  ] } };
  const set = sets[who];
  set.artists.forEach(a => target.artists.set(a.id, a));
  for (const w of set.works) {
    const images = []; for (const [a, b, s] of w.images) images.push(await img(a, b, s));
    const id = newId(); target.artworks.set(id, { ...w, id, images });
  }
}

let store;

/* =====================================================================
   3. IMAGE PROCESSING  (resize on the phone before uploading)
   ===================================================================== */
async function decodeImage(file) {
  if ("createImageBitmap" in window) {
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch {}
  }
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error("Unreadable image"));
    img.src = URL.createObjectURL(file);
  });
}
function toJpeg(src, maxEdge, q) {
  const sw = src.width || src.naturalWidth, sh = src.height || src.naturalHeight;
  const k = Math.min(1, maxEdge / Math.max(sw, sh));
  const w = Math.round(sw * k), h = Math.round(sh * k);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(src, 0, 0, w, h);
  return new Promise((res, rej) => c.toBlob(b => b ? res({ blob: b, w, h }) : rej(new Error("Could not encode")), "image/jpeg", q));
}

/* =====================================================================
   4. ROUTER & NAVIGATION
   ===================================================================== */
const stack = [];          // in-app history, so Back behaves sensibly
const scrollMem = {};
let replacing = false;
function go(hash, { replace = false } = {}) {
  if (hash === (location.hash || "#/")) return;
  if (replace) { replacing = true; location.replace(hash); }
  else location.hash = hash;
}
function back(fallback) {
  if (stack.length > 1) history.back();
  else go(fallback, { replace: true });
}
window.addEventListener("hashchange", () => {
  const h = location.hash || "#/";
  if (replacing) { stack[stack.length - 1] = h; replacing = false; }
  else if (stack.length > 1 && stack[stack.length - 2] === h) stack.pop();
  else stack.push(h);
  render();
});
let lastHash = null;
function parse() {
  const h = (location.hash || "#/").slice(1);
  const [path, qs] = h.split("?");
  const parts = path.split("/").filter(Boolean);
  return { parts, q: new URLSearchParams(qs || ""), hash: "#" + h };
}

function render() {
  S.keyMove = null;
  if (lastHash) scrollMem[lastHash] = window.scrollY;
  const r = parse();
  // leaving the artwork editor without saving → tidy up uploads
  if (S.draft && !(r.parts[0] === "artwork" && (r.parts[2] === "edit" || r.parts[1] === "new"))) discardDraft();

  if (!S.user) { lastHash = null; return renderAuth(); }
  if (!S.loaded) { app.innerHTML = '<div class="spin"></div>'; return; }

  let parts = r.parts, v = null;
  G = OWN_CTX; R = "#";
  if (parts[0] === "s" && parts[1]) {            // a gallery shared with me: #/s/{ownerId}/...
    const ctx = ensureShared(parts[1]);
    G = ctx; R = ctx.base; parts = parts.slice(2);
    if (ctx.gone) v = viewGone(ctx);
    else if (!ctx.loaded) v = { title: "", left: backBtn("Shared", "#/shared"), body: '<div class="spin"></div>' };
  }
  const [a, b, c] = parts;
  if (v) { /* already decided */ }
  else if (G.ro) {
    if (a === "gallery") v = viewGallery();
    else if (a === "artist" && b) v = viewArtist(b);
    else if (a === "artwork" && b) v = viewArtwork(b);
    else v = viewArtists();
  }
  else if (!a || a === "artists") v = viewArtists();
  else if (a === "gallery") v = viewGallery();
  else if (a === "account") v = viewAccount();
  else if (a === "share" && b) v = viewShareCode(b);
  else if (a === "share") v = viewShareNew();
  else if (a === "sharing") v = viewSharing();
  else if (a === "shared") v = viewSharedWithMe();
  else if (a === "invite" && b) v = viewInvite(b);
  else if (a === "artist" && b === "new") v = viewArtistForm(null);
  else if (a === "artist" && c === "edit") v = viewArtistForm(b);
  else if (a === "artist") v = viewArtist(b);
  else if (a === "artwork" && b === "new") v = viewArtworkForm(null, r.q.get("artist"));
  else if (a === "artwork" && c === "edit") v = viewArtworkForm(b);
  else if (a === "artwork") v = viewArtwork(b);
  else v = viewArtists();
  if (!v) return;  // a view redirected

  document.body.classList.toggle("has-tabs", !!v.tab);
  const banner = G.ro ? `<div class="ctx-banner"><span>${G.ownerName ? `Viewing <b>${esc(possessive(G.ownerName))}</b> gallery` : "Viewing a shared gallery"}</span><a href="#/artists">Back to mine</a></div>` : "";
  app.innerHTML =
    (DEMO ? '<div class="demo-banner">Demo mode — sample data, nothing is saved. Add your Firebase settings to go live.</div>' : "") +
    `<header class="bar"><div class="bar-l">${v.left || ""}</div><h1 class="bar-t">${esc(v.title || "")}</h1><div class="bar-r">${v.right || ""}</div></header>` + banner +
    `<main class="${v.mainClass || ""}">${v.body}</main>` +
    (v.tab ? `<nav class="tabs">
      <a href="${R}/artists" class="${v.tab === "artists" ? "on" : ""}">${I.people}<span>Artists</span></a>
      <a href="${R}/gallery" class="${v.tab === "gallery" ? "on" : ""}">${I.frames}<span>Gallery</span></a>
      ${!G.ro && S.sharedWithMe.size ? `<a href="#/shared" class="${v.tab === "shared" ? "on" : ""}">${I.shared}<span>Shared with me</span></a>` : ""}</nav>` : "");
  v.after && v.after();
  const same = r.hash === lastHash;
  window.scrollTo(0, same ? scrollMem[r.hash] || window.scrollY : (scrollMem[r.hash] || 0));
  lastHash = r.hash;
}
// re-render when data changes, keeping scroll position and any half-filled form
function dataChanged() { S.loaded = true; rerender(); }
function rerender() {
  if (app.querySelector("form[data-keep]")) return;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

/* Open (or reuse) a live, read-only connection to a gallery shared with me */
function ensureShared(owner) {
  const ptr = S.sharedWithMe.get(owner);
  if (S.sharedCtx && S.sharedCtx.owner === owner) {
    if (ptr && !S.sharedCtx.ownerName) S.sharedCtx.ownerName = ptr.ownerName || "";
    return S.sharedCtx;
  }
  closeShared();
  const ctx = { owner, ro: true, base: `#/s/${owner}`, artists: new Map(), artworks: new Map(), got: { a: false, w: false },
    loaded: false, gone: false, scope: null, own: "all", filter: "all", ownerName: (ptr && ptr.ownerName) || "" };
  S.sharedCtx = ctx;
  const upd = () => {
    ctx.loaded = ctx.got.a && ctx.got.w;
    const q = parse().parts;
    if (S.sharedCtx === ctx && q[0] === "s" && q[1] === owner) rerender();
  };
  ctx.close = store.openShared(owner, {
    scope: sc => { ctx.scope = sc; ctx.got.w = false; },
    artists: m => { ctx.artists = m; ctx.got.a = true; upd(); },
    works: m => { ctx.artworks = m; ctx.got.w = true; upd(); },
    gone: () => { ctx.gone = true; upd(); if (S.sharedWithMe.has(owner)) store.removePointer(owner).catch(() => {}); },
  });
  return ctx;
}
function closeShared() { if (S.sharedCtx) { S.sharedCtx.close && S.sharedCtx.close(); S.sharedCtx = null; } }

const backBtn = (label, fallback) => `<button class="ibtn back" data-back="${esc(fallback)}">${I.back}<span>${esc(label)}</span></button>`;
document.addEventListener("click", e => {
  const b = e.target.closest("[data-back]");
  if (b) { e.preventDefault(); back(b.dataset.back); }
});

function viewArtists() {
  const list = artistsSorted().filter(a => !G.ro || worksOf(a.id).length);
  const right = G.ro ? "" : `<a class="ibtn" href="#/share" aria-label="Share my gallery">${I.share}</a><a class="ibtn" href="#/account" aria-label="Account">${I.user}</a><a class="ibtn" href="#/artist/new" aria-label="Add artist">${I.plus}</a>`;
  if (!list.length && G.ro) return { tab: "artists", title: "", right, left: backBtn("Shared", "#/shared"),
    body: `<div class="empty"><h2 class="display">Nothing to see yet</h2><p>${esc(G.ownerName || "They")} hasn’t added anything you can see yet.</p></div>` };
  if (!list.length) return {
    tab: "artists", title: "Artists", right,
    body: `<div class="empty"><h2 class="display">Your gallery is empty</h2><p>Start by adding an artist, then add their artworks and photos.</p><a class="btn" href="#/artist/new">${I.plus} Add an artist</a></div>`,
  };
  const rows = list.map(a => {
    const c = artistCover(a.id), n = worksOf(a.id).length;
    return `<li data-s="${esc((a.name + " " + (a.nationality || "")).toLowerCase())}"><a class="row" href="${R}/artist/${a.id}">
      <div class="thumb">${c ? `<img src="${esc(c.thumbUrl || c.url)}" alt="" loading="lazy">` : `<span class="initials">${esc(initials(a.name))}</span>`}</div>
      <div class="row-main"><div class="row-name">${esc(a.name)}</div><div class="row-meta">${esc(artistMeta(a)) || "&nbsp;"}</div></div>
      <div class="count">${n}${I.chev}</div></a></li>`;
  }).join("");
  return {
    tab: "artists", title: "", right,
    left: G.ro ? backBtn("Shared", "#/shared") : `<span class="eyebrow" style="padding-left:8px">${list.length} artist${list.length === 1 ? "" : "s"}</span>`,
    body: `<h2 class="display page-title">Artists</h2>
      ${list.length > 5 ? `<div class="search">${I.search}<input id="q" type="search" placeholder="Search artists" autocomplete="off"></div>` : ""}
      <ul class="list" id="alist">${rows}</ul>`,
    after() {
      const q = document.getElementById("q");
      q && q.addEventListener("input", () => {
        const t = q.value.trim().toLowerCase();
        document.querySelectorAll("#alist li").forEach(li => li.hidden = !!t && !li.dataset.s.includes(t));
      });
    },
  };
}

function viewArtist(id) {
  const a = G.artists.get(id);
  const works = a ? worksOf(id) : [];
  if (!a || (G.ro && !works.length)) return notFound("Artist not found");
  const tiles = works.map(w => {
    const c = cover(w);
    return `<a class="tile" href="${R}/artwork/${w.id}"><div class="tile-img">${c ? `<img src="${esc(c.thumbUrl || c.url)}" alt="" loading="lazy">` : `<span class="noimg">No photo</span>`}</div>
      <div class="tile-cap"><b>${esc(w.title || "Untitled")}</b><span>${esc(w.year || "")}${seenPill(w)}</span></div></a>`;
  }).join("");
  return {
    title: "", left: backBtn("Artists", R + "/artists"),
    right: G.ro ? "" : `<a class="ibtn" href="#/artist/${id}/edit">Edit</a>`,
    body: `<section class="artist-head"><h2 class="display">${esc(a.name)}</h2>
        ${artistMeta(a) ? `<p class="meta">${esc(artistMeta(a))}</p>` : ""}
        ${a.bio ? `<p class="bio">${esc(a.bio)}</p>` : ""}</section>
      <div class="section-h"><span class="eyebrow">Artworks · ${works.length}</span>${G.ro ? "" : `<a class="btn small" href="#/artwork/new?artist=${id}">${I.plus} Add artwork</a>`}</div>
      ${works.length ? `<div class="grid">${tiles}</div>` : `<div class="empty" style="padding:30px 10px"><p>No artworks yet for ${esc(a.name)}.</p></div>`}`,
  };
}

function viewArtwork(id) {
  const w = G.artworks.get(id);
  if (!w) return notFound("Artwork not found");
  const a = G.artists.get(w.artistId) || { name: "Unknown artist" };
  const imgs = w.images || [];
  const sib = worksOf(w.artistId);
  const pos = sib.findIndex(x => x.id === id);
  const prev = sib[pos - 1], next = sib[pos + 1];
  const ratio = imgs.length ? Math.max(...imgs.map(i => (i.h || 1) / (i.w || 1))) : 1;
  const slideH = `min(72svh, ${(ratio * 100).toFixed(1)}cqw)`;
  // The sequence that swiping moves through: the Gallery (with its filters) if we came from there, otherwise this artist's works
  const fromGallery = stack.length > 1 && (stack[stack.length - 2] || "").startsWith(R + "/gallery");
  let seq = fromGallery ? galleryWorks() : sib;
  if (!seq.some(x => x.id === id)) seq = sib;
  const seqPos = seq.findIndex(x => x.id === id);
  const canStep = seq.length > 1;
  const anim = S.navDir > 0 ? "in-next" : S.navDir < 0 ? "in-prev" : "";
  const navBtns = canStep ? `<button class="stage-nav l" data-step="-1" aria-label="Previous">${I.back}</button><button class="stage-nav r" data-step="1" aria-label="Next">${I.chev}</button>` : "";
  const hint = `Tap to zoom${canStep ? " · swipe for next artwork" : imgs.length > 1 ? " · swipe for more views" : ""}`;

  const stage = imgs.length
    ? `<div class="stage-wrap">${navBtns}<div class="slides ${anim}" id="slides">${imgs.map((im, i) =>
        `<figure class="slide" data-i="${i}" style="height:${slideH}"><img src="${esc(im.url)}" alt="${esc(w.title || "")}${imgs.length > 1 ? `, view ${i + 1}` : ""}" ${i ? 'loading="lazy"' : ""} width="${im.w || ""}" height="${im.h || ""}"></figure>`).join("")}</div></div>
       <div class="stage-ui">${imgs.length > 1 ? `<div class="dots" id="dots">${imgs.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : ""}
       <span class="zoom-hint">${I.zoom}${hint}</span>${fromGallery && canStep ? `<span class="seq-pos">${seqPos + 1} / ${seq.length}</span>` : ""}</div>`
    : `<div class="stage-wrap">${navBtns}<div class="stage-empty ${anim}">No photos yet.${G.ro ? "" : `<br><br><a class="btn small" href="#/artwork/${id}/edit">${I.camera} Add photos</a>`}</div></div>`;

  const own = ownOf(w);
  const facts = [["Date", w.year], ["Medium", w.medium], ["Size", w.dimensions], [whereLabel(own), w.location]].filter(f => f[1]);
  const left = unsorted().filter(x => x.id !== id);
  const ask = G.ro ? "" : own === "unset" ? `<div class="own-ask" id="own-ask"><p>Is this artwork in your collection?</p>
      <div class="btns"><button class="btn small" data-own="mine">Yes, it's mine</button><button class="btn small ghost" data-own="seen">No, seen elsewhere</button></div>
      ${left.length ? `<p class="left">${left.length} other artwork${left.length === 1 ? "" : "s"} still to sort</p>` : ""}</div>`
    : (S.justSorted === id && left.length ? `<a class="next-sort" href="${R}/artwork/${left[0].id}" data-replace>Next artwork to sort (${left.length} left) ›</a>` : "");
  const strip = sib.length > 1 ? `<section class="more">
      <div class="more-h"><span class="eyebrow">More by ${esc(a.name)}</span><span class="muted" style="font-size:13px">${pos + 1} of ${sib.length}</span></div>
      <div class="strip" id="strip">${sib.map(x => { const c = cover(x); return `<a href="${R}/artwork/${x.id}" data-replace class="${x.id === id ? "on" : ""}">
        <div class="s-img">${c ? `<img src="${esc(c.thumbUrl || c.url)}" alt="" loading="lazy">` : ""}</div><div class="s-cap">${esc(x.title || "Untitled")}</div></a>`; }).join("")}</div>
      <div class="pn">${prev ? `<a href="${R}/artwork/${prev.id}" data-replace class="prev"><span>‹ Previous</span><b>${esc(prev.title || "Untitled")}</b></a>` : `<span class="none"></span>`}
        ${next ? `<a href="${R}/artwork/${next.id}" data-replace class="next"><span>Next ›</span><b>${esc(next.title || "Untitled")}</b></a>` : `<span class="none"></span>`}</div>
    </section>` : "";

  return {
    title: "", mainClass: "flush",
    left: fromGallery ? backBtn("Gallery", R + "/gallery") : backBtn(a.name, w.artistId ? `${R}/artist/${w.artistId}` : R + "/artists"),
    right: G.ro ? "" : `<a class="ibtn" href="#/artwork/${id}/edit">Edit</a>`,
    body: `${stage}
      <section class="aw-info ${anim}">${own !== "unset" ? `<p class="own-tag ${own}">${ownLabel(own)}</p>` : ""}<h2 class="display">${esc(w.title || "Untitled")}</h2>
        <p class="aw-artist"><a href="${R}/artist/${w.artistId}">${esc(a.name)}</a>${artistMeta(a) ? ` <span class="muted">(${esc(artistMeta(a))})</span>` : ""}</p>
        ${facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
        ${w.notes ? `<p class="notes">${esc(w.notes)}</p>` : ""}
        ${ask}</section>
      ${strip}
      ${a.bio ? `<div class="about"><details><summary>About ${esc(a.name)}</summary><p class="bio">${esc(a.bio)}</p></details></div>` : ""}`,
    after() {
      if (S.justSorted && S.justSorted !== id) S.justSorted = null;
      const askBox = document.getElementById("own-ask");
      askBox && askBox.addEventListener("click", async e => {
        const b = e.target.closest("[data-own]"); if (!b) return;
        askBox.querySelectorAll("button").forEach(x => x.disabled = true);
        S.justSorted = id;
        try { await store.save("artworks", { id, ownership: b.dataset.own }, false); }
        catch (err) { console.error(err); toast("Couldn't save — " + (err.code || err.message)); S.justSorted = null; render(); }
      });
      S.navDir = 0;
      const slides = document.getElementById("slides");
      const wrap = document.querySelector(".stage-wrap");
      const strip = document.getElementById("strip");
      if (strip) { const on = strip.querySelector(".on"); on && (strip.scrollLeft = on.offsetLeft - strip.clientWidth / 2 + 38); }
      const n = imgs.length;
      const view = () => slides ? Math.round(slides.scrollLeft / slides.clientWidth) : 0;
      const setView = (i, smooth = true) => slides && slides.scrollTo({ left: i * slides.clientWidth, behavior: smooth ? "smooth" : "auto" });
      // move to the next/previous artwork in the sequence, wrapping round at the ends
      const stepArt = dir => {
        if (!canStep) return;
        const nx = seq[(seqPos + dir + seq.length) % seq.length];
        S.navDir = dir; S.startView = dir < 0 ? "last" : 0;
        go(`${R}/artwork/${nx.id}`, { replace: true });
      };
      // next view of this artwork, or on to the next artwork after its last view
      const move = dir => { const v = view(); if (dir > 0 && v < n - 1) setView(v + 1); else if (dir < 0 && v > 0) setView(v - 1); else stepArt(dir); };
      S.keyMove = move;
      if (slides && S.startView !== null) setView(S.startView === "last" ? n - 1 : S.startView, false);
      S.startView = null;

      // swiping past the last (or first) view goes to the next (or previous) artwork
      let sx = null, sy = 0, atS = false, atE = false;
      wrap.addEventListener("touchstart", e => {
        if (e.touches.length !== 1) { sx = null; return; }
        sx = e.touches[0].clientX; sy = e.touches[0].clientY;
        const v = view(); atS = v <= 0; atE = v >= n - 1;
      }, { passive: true });
      wrap.addEventListener("touchend", e => {
        if (sx === null) return;
        const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
        if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
        if (dx < 0 && atE) stepArt(1); else if (dx > 0 && atS) stepArt(-1);
      }, { passive: true });
      wrap.addEventListener("click", e => { const b = e.target.closest("[data-step]"); if (b) move(+b.dataset.step); });

      if (!slides) return;
      const dots = document.querySelectorAll("#dots i");
      const dotsSync = () => { const i = view(); dots.forEach((d, k) => d.classList.toggle("on", k === i)); };
      slides.addEventListener("scroll", dotsSync, { passive: true }); dotsSync();
      slides.addEventListener("click", e => {
        const f = e.target.closest(".slide"); if (!f) return;
        openZoom(seq, id, +f.dataset.i, (artId, k) => {
          if (artId === id) setView(k, false);
          else { S.startView = k; go(`${R}/artwork/${artId}`, { replace: true }); }
        });
      });
    },
  };
}
document.addEventListener("keydown", e => {
  if (!S.keyMove || document.querySelector(".pswp--open") || /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName)) return;

let PhotoSwipe;
async function openZoom(seq, curId, curView, onClose) {
  try {
    PhotoSwipe ||= (await import("https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.min.js")).default;
  } catch { toast("Couldn't load the zoom viewer — check your connection"); return; }
  // every view of every artwork in the sequence, so swiping carries on to the next artwork
  const items = []; let start = 0;
  seq.forEach(w => {
    const a = G.artists.get(w.artistId);
    (w.images || []).forEach((im, k) => {
      if (w.id === curId && k === curView) start = items.length;
      items.push({ src: im.url, msrc: im.thumbUrl || im.url, width: im.w || 1600, height: im.h || 1200, artId: w.id, k,
        cap: `<b>${esc(w.title || "Untitled")}</b><span>${esc(a ? a.name : "")}${w.year ? ", " + esc(w.year) : ""}${(w.images || []).length > 1 ? ` · view ${k + 1} of ${w.images.length}` : ""}</span>` });
    });
  });
  if (!items.length) return;
  const pswp = new PhotoSwipe({
    dataSource: items, index: start, bgOpacity: 1, maxZoomLevel: 6, secondaryZoomLevel: 2.5, showHideAnimationType: "fade",
    wheelToZoom: true, loop: seq.length > 1, closeTitle: "Close", zoomTitle: "Zoom",
  });
  pswp.on("uiRegister", () => pswp.ui.registerElement({
    name: "caption", order: 9, isButton: false, appendTo: "root", html: "",
    onInit: (el, p) => { const upd = () => { const it = items[p.currIndex]; el.innerHTML = it ? it.cap : ""; }; p.on("change", upd); upd(); },
  }));
  pswp.on("close", () => { const it = items[pswp.currIndex]; it && onClose && onClose(it.artId, it.k); });
  pswp.init();
}

const inviteUrl = code => `${location.origin}${location.pathname}#/invite/${code}`;
function fmtWhen(d) {
  const t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((new Date(d).setHours(0, 0, 0, 0) - today) / 864e5);
  return diff === 0 ? `today at ${t}` : diff === 1 ? `tomorrow at ${t}` : diff === -1 ? `yesterday at ${t}`
    : `${d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" })} at ${t}`;
}
let qrLib;
async function renderQR(el, text) {
  if (!el) return;
  try { qrLib ||= (await import("https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.mjs")).default; }
  catch { el.innerHTML = '<p class="hint" style="padding:20px 6px">Couldn’t load the QR code — use “Copy link” instead.</p>'; return; }
  const qr = qrLib(0, "M"); qr.addData(text); qr.make();
  el.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
}

  const pending = [...S.invites.values()].filter(i => !i.claimedBy && ms(i.expiresAt) > now).sort((a, b) => ms(b.expiresAt) - ms(a.expiresAt));

  return {
    title: "", left: backBtn("Back", "#/artists"),

      ${people.length ? `<ul class="plist">${people.map(p => `<li><div class="who"><b>${esc(p.viewerEmail || "Someone")}</b><span>Can see</span></div>
          <select data-scope="${esc(p.id)}" aria-label="What ${esc(p.viewerEmail || "they")} can see">${opts(p.scope)}</select>
          <button class="linkbtn danger" data-remove="${esc(p.id)}">Remove</button></li>`).join("")}</ul>`
        : `<p class="muted" style="margin:6px 0 22px">No one yet.</p>`}
      ${pending.length ? `<p class="h3">Invitations not yet accepted</p><ul class="plist">${pending.map(i => `<li><div class="who"><b>${esc(scopeShort[i.scope])}</b><span>Expires ${esc(fmtWhen(new Date(ms(i.expiresAt))))}</span></div>
          <a class="linkbtn" href="#/share/${esc(i.id)}">Show</a><button class="linkbtn danger" data-cancel="${esc(i.id)}">Cancel</button></li>`).join("")}</ul>` : ""}
      <a class="btn block" href="#/share">${I.share} Share with someone new</a>`,
    after() {
      // tidy away invitations that have been used or have expired
      for (const i of S.invites.values()) if ((i.claimedBy || ms(i.expiresAt) < now) && !tidying.has(i.id)) { tidying.add(i.id); store.cancelInvite(i.id).catch(() => {}); }
      const m = document.querySelector("main");
      m.addEventListener("change", async e => {
        const sel = e.target.closest("[data-scope]"); if (!sel) return;
        try { await store.setShareScope(sel.dataset.scope, sel.value); toast("Updated"); } catch (err) { toast("Couldn't update — " + (err.code || err.message)); }
      });
      m.addEventListener("click", async e => {
        const rm = e.target.closest("[data-remove]"), cn = e.target.closest("[data-cancel]");
        if (rm) {
          const p = S.shares.get(rm.dataset.remove);

        }
      });
    },
  };
}

/* ---------- accepting an invitation ---------- */
function viewInvite(code) {
  const st = S.inviteCheck;
  if (!st || st.code !== code) {
    S.inviteCheck = { code, status: "loading" };
    store.getInvite(code).then(inv => {
      let status;
      if (!inv) status = "invalid";
      else if (inv.owner === S.user.uid) status = "own";
      else if (inv.claimedBy === S.user.uid) status = "accepted";
      else if (inv.claimedBy) status = "used";
      else if (ms(inv.expiresAt) < Date.now()) status = "expired";
      else status = "ok";
      S.inviteCheck = { code, status, inv };
    }).catch(err => { console.error(err); S.inviteCheck = { code, status: "error" }; })
      .then(() => { const q = parse().parts; if (q[0] === "invite" && q[1] === code) render(); });
  }
  const { status, inv } = S.inviteCheck;
  const head = { title: "", left: backBtn("My gallery", "#/artists") };
  if (status === "loading") return { ...head, body: '<div class="spin"></div>' };
  if (status === "accepted") { go(`#/s/${inv.owner}/artists`, { replace: true }); return null; }
  const who = esc((inv && inv.ownerName) || "The owner");
  const msg = {
    invalid: ["Invitation not found", "It may have been cancelled. Ask for a new one."],
    expired: ["This invitation has expired", `Invitations last ${INVITE_HOURS} hours. Ask ${who} for a new one.`],
    used: ["Already used", `Each invitation works for one person only. Ask ${who} for your own.`],
    own: ["This is your own invitation", "Send it to the person you want to share your gallery with."],
    error: ["Couldn’t check this invitation", "Check your internet connection and try again."],
  }[status];
  if (msg) return { ...head, body: `<div class="empty"><h2 class="display">${msg[0]}</h2><p>${msg[1]}</p>
    ${status === "own" ? `<a class="btn" href="#/share/${esc(code)}">Show it</a>` : `<a class="btn" href="#/artists">Go to my gallery</a>`}</div>` };
  return {
    ...head,
    body: `<div class="invite-card"><p class="eyebrow">Invitation</p><h2 class="display">${who}</h2>
      <p>would like to share their art gallery with you.</p>
      <p class="muted">You’ll be able to see ${esc(scopeText[inv.scope] || "their gallery")}. This invitation is just for you.</p>
      <div class="btn-row"><button class="btn" id="accept">Accept</button><a class="btn ghost" href="#/artists">Not now</a></div></div>`,
    after() {
      const btn = document.getElementById("accept");
      btn.onclick = async () => {
        btn.disabled = true;
        try { await store.acceptInvite(inv); S.inviteCheck = null; go(`#/s/${inv.owner}/artists`, { replace: true }); }
        catch (err) { console.error(err); btn.disabled = false; toast("Couldn’t accept — the invitation may have expired or already been used", 5000); S.inviteCheck = null; render(); }
      };
    },
  };
}

      <div class="group"><div class="field" style="margin:0"><label for="f-bio">About the artist</label><textarea id="f-bio" name="bio" rows="6">${esc(a.bio || "")}</textarea></div></div>
      <button class="btn block" type="submit">Save artist</button>
      ${id ? `<div class="danger-zone"><button type="button" class="btn danger" id="del">Delete artist${nWorks ? ` and ${nWorks} artwork${nWorks === 1 ? "" : "s"}` : ""}</button></div>` : ""}
    </form>`,
    after() {
      const form = document.getElementById("af");
      if (!id) document.getElementById("f-name").focus();
      form.addEventListener("submit", async e => {
        e.preventDefault();
        const d = clean(Object.fromEntries(new FormData(form)));
        if (!d.name) { toast("Please enter a name"); return; }
        const obj = { id: id || newId(), ...d };
        try { const p = store.save("artists", obj, !id); go(`#/artist/${obj.id}`, { replace: true }); await p; }
        catch (err) { console.error(err); toast("Couldn't save — " + (err.code || err.message)); }
      });
      const del = document.getElementById("del");
      del && del.addEventListener("click", async () => {
        if (!confirm(`Delete ${a.name}${nWorks ? ` and all ${nWorks} of their artworks and photos` : ""}? This can't be undone.`)) return;
        try {
          for (const w of worksOf(id)) await deleteArtwork(w);
          await store.remove("artists", id);
          toast("Artist deleted"); go("#/artists", { replace: true });
        } catch (err) { console.error(err); toast("Couldn't delete — " + (err.code || err.message)); }
      });
    },
  };
}

async function deleteArtwork(w) {
  for (const im of w.images || []) { await store.deleteFile(im.path); await store.deleteFile(im.thumbPath); }
  await store.remove("artworks", w.id);
}

/* ---------- artwork form ---------- */
function viewArtworkForm(id, presetArtist) {
  const w = id ? G.artworks.get(id) : null;
  if (id && !w) return notFound("Artwork not found");
  const artists = artistsSorted();
  if (!artists.length) { go("#/artist/new", { replace: true }); return null; }
  const draftId = id || (S.draft && S.draft.isNew ? S.draft.id : newId());
  if (!S.draft || S.draft.id !== draftId) {
    S.draft = { id: draftId, isNew: !id, images: (w ? w.images || [] : []).map(x => ({ ...x })), original: (w ? w.images || [] : []).map(x => x.id), added: [], busy: 0, saved: false };
  }
  const artistId = w ? w.artistId : (presetArtist || artists[0].id);
  const v = w || {};
  const f = (k, label, extra = "") => `<div class="field"><label for="f-${k}">${label}</label><input id="f-${k}" name="${k}" value="${esc(v[k] || "")}" ${extra}></div>`;
  const cancelTo = id ? `#/artwork/${id}` : `#/artist/${artistId}`;
  return {
    title: id ? "Edit artwork" : "New artwork",
    left: `<button class="ibtn" data-back="${cancelTo}">Cancel</button>`,
    right: `<button class="ibtn strong" form="wf" type="submit" id="save-top">Save</button>`,
    body: `<form id="wf" class="form" data-keep autocomplete="off">
      <div class="group"><h3>Photos</h3><div class="imgs" id="imgs"></div>
        <p class="hint">The first photo is the main image. Tap ★ to make a photo the main one. You can add several views of the same artwork.</p></div>
      <div class="group">
        <div class="field"><label for="f-artistId">Artist</label><select id="f-artistId" name="artistId">${artists.map(a => `<option value="${a.id}" ${a.id === artistId ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select></div>
        ${f("title", "Title", 'autocapitalize="words" placeholder="Untitled"')}
        <div class="two">${f("year", "Date", 'placeholder="e.g. 1931 or c.1890"')}${f("dimensions", "Size", 'placeholder="e.g. 60 × 80 cm"')}</div>
        ${f("medium", "Medium", 'placeholder="e.g. Oil on canvas"')}
        <div class="field"><label>This artwork is…</label><div class="seg" id="own-seg">
          <label><input type="radio" name="ownership" value="mine" ${v.ownership === "mine" ? "checked" : ""}><span>In my collection</span></label>
          <label><input type="radio" name="ownership" value="seen" ${v.ownership === "seen" ? "checked" : ""}><span>Seen elsewhere</span></label></div></div>
        <div class="field"><label for="f-location" id="loc-label">${whereLabel(ownOf(v))}</label><input id="f-location" name="location" value="${esc(v.location || "")}"></div>
      </div>
      <div class="group"><div class="field" style="margin:0"><label for="f-notes">Notes</label><textarea id="f-notes" name="notes" rows="5">${esc(v.notes || "")}</textarea></div></div>
      <button class="btn block" type="submit" id="save-bottom">Save artwork</button>
      ${id ? `<div class="danger-zone"><button type="button" class="btn danger" id="del">Delete artwork</button></div>` : ""}
    </form>`,
    after() {
      renderImgs();
      const form = document.getElementById("wf");
      const seg = document.getElementById("own-seg"), loc = document.getElementById("f-location");
      const ph = { mine: "e.g. Living room, or where you bought it", seen: "Gallery, museum or exhibition", unset: "Choose one of the options above first" };
      const syncOwn = () => { const o = (form.querySelector("input[name=ownership]:checked") || {}).value || "unset";
        document.getElementById("loc-label").textContent = whereLabel(o); loc.placeholder = ph[o]; if (o !== "unset") seg.classList.remove("need"); };
      seg.addEventListener("change", syncOwn); syncOwn();
      form.addEventListener("submit", async e => {
        e.preventDefault();
        const D = S.draft;
        if (D.busy) { toast("Please wait for photos to finish uploading"); return; }
        const d = clean(Object.fromEntries(new FormData(form)));
        if (!d.ownership) { seg.classList.add("need"); seg.scrollIntoView({ behavior: "smooth", block: "center" }); toast("Please choose: in your collection, or seen elsewhere"); return; }
        const images = D.images.filter(x => x.url && !x.failed).map(({ id, url, thumbUrl, path, thumbPath, w, h }) => ({ id, url, thumbUrl, path, thumbPath, w, h }));
        const obj = { id: D.id, ...d, images };
        const keep = new Set(images.map(x => x.id));
        const gone = (w ? w.images || [] : []).filter(x => !keep.has(x.id));
        D.saved = true;
        try {
          const p = store.save("artworks", obj, D.isNew);
          S.draft = null;
          go(`${R}/artwork/${obj.id}`, { replace: true });
          await p;
          for (const im of gone) { store.deleteFile(im.path); store.deleteFile(im.thumbPath); }
        } catch (err) { console.error(err); toast("Couldn't save — " + (err.code || err.message)); }
      });
      const del = document.getElementById("del");
      del && del.addEventListener("click", async () => {
        if (!confirm(`Delete “${w.title || "Untitled"}” and its photos? This can't be undone.`)) return;
        const D = S.draft; D.saved = true;
        try {
          for (const im of D.added) { store.deleteFile(im.path); store.deleteFile(im.thumbPath); }
          S.draft = null;
          await deleteArtwork(w); toast("Artwork deleted"); go(`#/artist/${w.artistId}`, { replace: true });
        } catch (err) { console.error(err); toast("Couldn't delete — " + (err.code || err.message)); }
      });
    },
  };
}

function renderImgs() {
  const box = document.getElementById("imgs"); if (!box || !S.draft) return;
  const D = S.draft;
  box.innerHTML = D.images.map((im, i) => `<div class="img-item ${im.uploading ? "busy" : ""}" data-id="${im.id}">
      <img src="${esc(im.local || im.thumbUrl || im.url)}" alt="">
      ${!im.uploading ? `<button type="button" class="x" data-act="rm" aria-label="Remove photo">${I.x}</button>` : ""}
      ${i === 0 && !im.uploading ? `<span class="main-badge">Main</span>` : ""}
      ${i > 0 && !im.uploading ? `<button type="button" class="star" data-act="main" aria-label="Make main photo">${I.star}</button>` : ""}
      ${im.uploading ? `<div class="prog"><i style="width:${Math.round((im.progress || 0) * 100)}%"></i></div>` : ""}
    </div>`).join("") +
    `<label class="add-img">${I.camera}<span>Add photos</span><input type="file" accept="image/*" multiple hidden id="pick"></label>`;
  document.getElementById("pick").addEventListener("change", e => { addFiles([...e.target.files]); e.target.value = ""; });
  box.onclick = e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.closest(".img-item").dataset.id;
    const i = D.images.findIndex(x => x.id === id); if (i < 0) return;
    if (b.dataset.act === "main") { const [x] = D.images.splice(i, 1); D.images.unshift(x); }
    if (b.dataset.act === "rm") {
      const [x] = D.images.splice(i, 1);
      if (D.added.includes(x)) { store.deleteFile(x.path); store.deleteFile(x.thumbPath); D.added = D.added.filter(y => y !== x); }
    }
    renderImgs();
  };
  ["save-top", "save-bottom"].forEach(s => { const el = document.getElementById(s); el && (el.disabled = !!D.busy); });
}

async function addFiles(files) {
  const D = S.draft; if (!D) return;
  const items = files.map(file => ({ id: newId(), file, local: URL.createObjectURL(file), uploading: true, progress: 0 }));
  D.images.push(...items); D.busy += items.length; renderImgs();
  for (const im of items) {
    try {
      const bmp = await decodeImage(im.file);
      const main = await toJpeg(bmp, MAIN_EDGE, MAIN_QUALITY);
      const th = await toJpeg(bmp, THUMB_EDGE, THUMB_QUALITY);
      bmp.close && bmp.close();
      const bar = () => { const el = document.querySelector(`.img-item[data-id="${im.id}"] .prog i`); el && (el.style.width = Math.round(im.progress * 100) + "%"); };
      const up1 = await store.upload(`artworks/${D.id}/${im.id}.jpg`, main.blob, p => { im.progress = p * 0.85; bar(); });
      const up2 = await store.upload(`artworks/${D.id}/${im.id}_t.jpg`, th.blob, p => { im.progress = 0.85 + p * 0.15; bar(); });
      Object.assign(im, { url: up1.url, path: up1.path, thumbUrl: up2.url, thumbPath: up2.path, w: main.w, h: main.h, uploading: false });
      delete im.file;
      if (S.draft === D) D.added.push(im); else { store.deleteFile(im.path); store.deleteFile(im.thumbPath); }
    } catch (err) {
      console.error(err);
      D.images = D.images.filter(x => x !== im);
      toast("Couldn't add a photo — " + (err.code || err.message));
    }
    D.busy--; if (S.draft === D) renderImgs();
  }
}

function discardDraft() {
  const D = S.draft; S.draft = null;
  if (!D || D.saved) return;
  for (const im of D.added) { store.deleteFile(im.path); store.deleteFile(im.thumbPath); }
}

/* ---------- sign in ---------- */
let authMode = null;
function renderAuth() {
  document.body.classList.remove("has-tabs");
  const invited = parse().parts[0] === "invite";
  const up = (authMode || (invited ? "up" : "in")) === "up";
  app.innerHTML = `<div class="auth"><h1 class="display">My Gallery</h1><p class="tag">Your personal collection of artworks</p>
    ${invited ? `<div class="notice"><b>You’ve been invited to see someone’s art gallery.</b><br>${up ? "Create a free account" : "Sign in"} to accept the invitation.</div>` : ""}
    <form id="lf">
      <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email" required></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="${up ? "new-password" : "current-password"}" minlength="6" required></div>
      <div class="err" id="err"></div>
      <button class="btn block" type="submit">${up ? "Create account" : "Sign in"}</button>
    </form>
    <div class="switch">${up ? `Already have an account? <button id="sw">Sign in</button>` : `New here? <button id="sw">Create an account</button>`}</div>
    ${up ? "" : `<div class="switch"><button id="fp" style="color:var(--muted);font-weight:400">Forgot password?</button></div>`}</div>`;
  const err = document.getElementById("err");
  const msg = e => ({
    "auth/invalid-credential": "Email or password is incorrect.", "auth/wrong-password": "Email or password is incorrect.",
    "auth/user-not-found": "No account with that email.", "auth/email-already-in-use": "An account with that email already exists — sign in instead.",
    "auth/weak-password": "Please use at least 6 characters.", "auth/invalid-email": "That email address doesn't look right.",
    "auth/too-many-requests": "Too many attempts. Please wait a moment.", "auth/network-request-failed": "No internet connection.",
  }[e.code] || e.message);
  document.getElementById("lf").addEventListener("submit", async e => {
    e.preventDefault(); err.textContent = "";
    const em = document.getElementById("em").value.trim(), pw = document.getElementById("pw").value;
    try { await (up ? store.signUp(em, pw) : store.signIn(em, pw)); } catch (x) { err.textContent = msg(x); }
  });
  document.getElementById("sw").onclick = () => { authMode = up ? "in" : "up"; renderAuth(); };
  const fp = document.getElementById("fp");
  fp && (fp.onclick = async () => {
    const em = document.getElementById("em").value.trim();
    if (!em) { err.textContent = "Type your email above, then tap “Forgot password?” again."; return; }
    try { await store.reset(em); toast("Password reset email sent"); } catch (x) { err.textContent = msg(x); }
  });
}

/* =====================================================================
   6. START
   ===================================================================== */
(async function start() {
  try { store = DEMO ? demoStore() : await firebaseStore(); }
  catch (e) { console.error(e); app.innerHTML = `<div class="empty"><h2 class="display">Couldn't start</h2><p>Check your internet connection and the Firebase settings in index.html.</p></div>`; return; }
  stack.push(location.hash || "#/");
  let first = true;
  store.onAuth(user => {
    const changed = first || (user && user.uid) !== (S.user && S.user.uid);
    first = false;
    S.user = user;
    if (!changed) return;
    store.unsubscribe(); closeShared();
    S.artists = new Map(); S.artworks = new Map(); S.loaded = false;
    S.shares = new Map(); S.invites = new Map(); S.sharedWithMe = new Map(); S.profile = {}; S.inviteCheck = null;
    if (user) {
      render();
      store.subscribe(dataChanged, err => { console.error(err); toast("Couldn't load your gallery — " + (err.code || err.message), 6000); });
    } else render();
  });
})();
</script>
